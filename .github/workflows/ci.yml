name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain versions
        run: moon version --all

      # On a fresh runner the registry index is not cloned yet: without this,
      # dependency resolution fails with "module was not found in the registry".
      - name: Update MoonBit dependencies
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Check formatting
        run: moon fmt --check

      - name: Check benchmark harness scripts
        run: |
          python3 -m py_compile bench/run_bench.py bench/gen_dataset.py \
            bench/record_demo.py bench/fsearch-compare/compare.py
          bash -n bench/demo.sh
          bash -n bench/fsearch-compare/build.sh

      - name: Benchmark dataset smoke test
        run: |
          python3 bench/gen_dataset.py --dir /tmp/moonsearch-dataset-smoke \
            --entries 2000 --reference-time 2026-01-01T00:00:00Z \
            > /tmp/moonsearch-dataset-smoke.json
          python3 -c 'import json; m = json.load(open("/tmp/moonsearch-dataset-smoke.json")); assert m["entries"] == 2000, m; print(m["manifest_sha256"])'

      - name: Build native
        run: moon build --target native

      - name: Run tests
        run: moon test --target native

      - name: Run CLI golden tests
        run: moon testcli test tests/cli.md --target native

      - name: Run Linux raw-byte process tests
        run: python3 tests/raw_bytes_linux.py

      - name: Run process pipe and signal tests
        run: python3 tests/process_reliability.py

      - name: Run sparse file end-to-end tests
        run: python3 tests/sparse_files.py

      - name: Run executable differential corpus
        run: python3 tests/executable_differential.py

      - name: Check generated interfaces are committed
        run: |
          moon info
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The release ships macOS and Windows binaries; compile them on every push so
  # a platform break surfaces here instead of during a release. macOS also runs
  # the tests: they cover DST, the POSIX backend, and byte-name semantics. The
  # Linux-only invalid-UTF-8 cases are compiled out on other platforms, and the
  # path fixtures assume Unix, so Windows only builds and smoke-tests.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show toolchain versions
        run: moon version --all

      - name: Update MoonBit dependencies
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Build native (macOS, debug for process tests)
        if: runner.os == 'macOS'
        run: moon build --target native

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: moon test --target native

      - name: Run POSIX process and fixture tests (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 tests/process_reliability.py
          python3 tests/sparse_files.py
          python3 tests/executable_differential.py

      - name: Build native release
        run: moon build --target native --release

      - name: Smoke test the binary
        run: _build/native/release/build/cmd/moonsearch/moonsearch.exe --version

